<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>404 · Page Not Found · ChimCare</title>
   <link rel="icon" type="image/jpeg" href="images/hero 2.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #e85d04;
      --accent-light: #ff8c42;
      --accent-dark: #b84300;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232, 93, 4, 0.18), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px;
      left: -200px;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232, 93, 4, 0.12), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .err-wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 640px;
      width: 100%;
    }

    /* Big 404 number */
    .err-code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.05em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .err-code .digit {
      display: inline-block;
      background: linear-gradient(180deg, var(--accent-light), var(--accent-dark));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      text-shadow:
        0 0 40px rgba(232, 93, 4, 0.35),
        0 0 80px rgba(232, 93, 4, 0.2);
      animation: glowPulse 3s ease-in-out infinite;
    }
    .err-code .zero {
      background: linear-gradient(180deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      text-shadow:
        0 0 40px rgba(255, 255, 255, 0.25),
        0 0 80px rgba(255, 255, 255, 0.12);
      animation: glowPulseWhite 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 22px rgba(232, 93, 4, 0.55)); }
      50%      { filter: drop-shadow(0 0 40px rgba(232, 93, 4, 0.8)); }
    }
    @keyframes glowPulseWhite {
      0%, 100% { filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.4)); }
      50%      { filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.6)); }
    }

    /* Heading */
    .err-title {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #fff;
    }
    .err-title span { color: var(--accent-light); }

    /* Subtitle */
    .err-text {
      font-size: clamp(0.92rem, 2.6vw, 1.05rem);
      color: rgba(240, 244, 248, 0.75);
      line-height: 1.7;
      margin-bottom: 2.2rem;
    }

    /* Button */
    .err-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      color: #fff;
      border: none;
      padding: 1rem 2.4rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 0.98rem;
      text-decoration: none;
      transition: 0.3s ease;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 12px 28px rgba(232, 93, 4, 0.45);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .err-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .err-btn:hover::before { opacity: 1; }
    .err-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(232, 93, 4, 0.65);
    }
    .err-btn span, .err-btn i { position: relative; z-index: 1; }
    .err-btn i { transition: transform 0.3s ease; }
    .err-btn:hover i { transform: translateX(-4px); }

    @media (max-width: 767px) {
      .err-code { margin-bottom: 0.6rem; }
      .err-text { margin-bottom: 1.8rem; }
      .err-btn { padding: 0.9rem 1.8rem; font-size: 0.9rem; }
    }
    @media (max-width: 480px) {
      .err-code { font-size: 5rem; }
      .err-title { font-size: 1.3rem; margin-bottom: 0.7rem; }
      .err-text { font-size: 0.85rem; margin-bottom: 1.5rem; padding: 0 0.5rem; }
      .err-btn { padding: 0.8rem 1.6rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="err-wrap">

    <div class="err-code">
      <span class="digit">4</span><span class="digit zero">0</span><span class="digit">4</span>
    </div>

    <h1 class="err-title">Lost In The <span>Smoke</span></h1>
    <p class="err-text">Oops! The page you're looking for seems to have drifted away. Let's get you back to a clean, smoke-free kitchen.</p>

    <a href="index.html" class="err-btn">
      <i class="fas fa-arrow-left"></i> <span>Back to ChimCare</span>
    </a>

  </div>

</body>
</html>
